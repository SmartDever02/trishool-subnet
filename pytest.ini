[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may require external services)
    slow: Slow running tests (may take a long time)
    asyncio: Async tests
asyncio_mode = auto
addopts = 
    -v
    --strict-markers
    --tb=short

